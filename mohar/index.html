<style>

jump:d=>{const el=document.getElementById('c-'+btoa(unescape(encodeURIComponent(d.k))).replace(/\W/g,''));if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}},
send:()=>{const O=open();S.versions.unshift({n:S.versions.length+1,text:S.text,status:'Awaiting review',from:S.role,ts:new Date().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),open:O.map(f=>({sev:f.sev,quote:f.quote,src:f.src})),dis:Object.entries(S.dismissed).map(([k,w])=>[k.split('|')[0]+' '+k.split('|')[1],w])});log('sent version '+S.versions[0].n+' to a reviewer');S.tab='appr';render();toast('Sent. Switch to Reviewer to decide.')},
approve:()=>{const v=lastV(),n=$('#note').value.trim();if(v.open.some(o=>o.sev==='Critical')&&!n)return toast('Add a comment to approve with a Critical finding open');v.status='Ready to publish';v.by=S.role;v.note=n;log('approved version '+v.n);render()},
changes:()=>{const v=lastV(),n=$('#note').value.trim();if(!n)return toast('Tell the creator what to change');v.status='Changes requested';v.by=S.role;v.note=n;S.ran=false;S.dismissed={};log('requested changes on version '+v.n+': '+n);render()},
addrule:()=>{const k=$('#gk').value,t=$('#gt').value.trim();if(!t)return toast('Write the text first');const n=String(S.extra.length+4).padStart(2,'0');if(k==='Banned phrase')S.extra.push({id:'B-'+n,cat:'Terminology',bad:t,good:'',text:'Never use "'+t+'".'});else S.extra.push({id:(k==='Approved fact'?'F-1':'N-')+n,cat:k==='Approved fact'?'Facts':'Guidelines',text:t});log('added to workspace: '+t);render();toast('Added to workspace')},addterm:()=>{const b=$('#tb').value.trim(),g=$('#tg').value.trim();if(!b||!g)return toast('Fill in both fields');S.extra.push({id:'T-'+String(4+S.extra.length).padStart(2,'0'),cat:'Terminology',title:'Term',bad:b,good:g,text:'Say "'+g+'", never "'+b+'".'});log('added terminology rule: '+b+' → '+g);render();toast('Rule added')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='draft')S.text=e.target.value});
document.addEventListener('change',e=>{const i=e.target.id,v=e.target.value;if(i==='fg'||i==='bg'){S[i]=v.toUpperCase();render()}else if(i==='ac'){S.accent=v.toUpperCase();render()}else if(i==='lg'){S.logo=v;render()}else if(i==='ct'){S.type=v;if(!S.text.trim()||Object.values(SAMPLES).some(s=>s.t===S.text)){const x=SAMPLES[v];S.text=x.t;S.fg=x.fg;S.accent=x.accent;S.logo=x.logo}render()}else if(i==='up'){loadFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z){e.preventDefault();z.classList.remove('over');loadFile(e.dataTransfer.files[0])}});
render();
</script></body></html>
